palette:
  colors:
    bg: "490999"
    fg: "white"
    accent: "439798"

default:
  margin:
    percent: 4
  colors:
    foreground: "p:fg"
    background: "p:bg"

slide_title:
  alignment: left
  padding_bottom: 0
  padding_top: 0
  colors:
    foreground: "p:fg"
  bold: true
  separator: true

code:
  alignment: center
  minimum_size: 2
  minimum_margin:
    percent: 2
  #theme_name: Dracula
  #theme_name: Nord
  theme_name: "Monokai Extended Bright"
  padding:
    horizontal: 2
    vertical: 1

execution_output:
  colors:
    # Ambar retro
    foreground: "FFC300"

inline_code:
  colors:
    # `This accents`
    foreground: "p:fg"
    background: "p:accent"

bold:
  colors:
    foreground: "p:accent"

intro_slide:
  title:
    alignment: center
    colors:
      foreground: "e81223"
  subtitle:
    alignment: center
    colors:
      foreground: "ffb902"
  author:
    alignment: center
    colors:
      foreground: "e0e0e0"
    positioning: page_bottom

headings:
  h1:
    prefix: "██"
    colors:
      foreground: "f7640d"
  h2:
    prefix: "▓▓▓"
    colors:
      foreground: "ffb902"
  h3:
    prefix: "▒▒▒▒"
    colors:
      foreground: "00FF00"
  h4:
    prefix: "░░░░░"
    colors:
      foreground: "00CCFF"
  h5:
    prefix: "░░░░░░"
    colors:
      foreground: "e81223"
  h6:
    prefix: "░░░░░░░"
    colors:
      foreground: "e0e0e0"

block_quote:
  prefix: "▍ "
  colors:
    foreground: "p:bg"
    background: "p:fg"
    prefix: "p:accent"

typst:
  colors:
    foreground: "f0f0f0"
    background: null

#footer:
#  style: progress_bar
#  colors:
#    foreground: "5c5c5c"
#  character: ░

footer:
  style: template
#  left: "My name is {title}"
#  center: "ok"
  right: "{current_slide} / {total_slides}"

modals:
  selection_colors:
    foreground: yellow
